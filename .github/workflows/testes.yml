name: testes
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build do aplicativo
        # O deploy do GitHub Pages também gera dist a partir de src.
        # dist é artefato; validar apenas o diff de bytes é frágil (ex.: logo/config).
        run: node build.js
      - run: npm test
